<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title data-i18n="appTitle">Mobile Simulator</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body data-theme="dark">

  <header id="toolbar">
    <div class="tb-group">
      <select id="deviceSelect" data-i18n-aria="deviceSelectAria" data-i18n-title="deviceSelectAria"
              aria-label="Switch device" title="Switch device"></select>
      <button id="rotateBtn" class="icon-btn" data-i18n-title="btnRotate" title="Rotate (portrait/landscape)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="3" width="10" height="18" rx="2"/>
          <path d="M3 8a9 9 0 0 1 2-3M21 16a9 9 0 0 1-2 3"/>
        </svg>
      </button>
      <button id="framelessBtn" class="icon-btn" aria-pressed="false"
              data-i18n-title="btnFrameless"
              title="Fullscreen: hide the frame and show only the screen at device resolution (keeps aspect ratio)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg>
      </button>
      <button id="stretchBtn" class="icon-btn" aria-pressed="false"
              data-i18n-title="btnStretch"
              title="Stretch: fill the window distorting aspect ratio (enables fullscreen)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h18"/>
          <path d="M7 8l-4 4 4 4"/>
          <path d="M17 8l4 4-4 4"/>
        </svg>
      </button>
      <button id="browserBtn" class="icon-btn" aria-pressed="true"
              data-i18n-title="btnBrowser"
              title="Browser bar: show Chrome/Safari chrome inside the mockup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M3 9h18"/>
          <circle cx="6" cy="6.5" r="0.5" fill="currentColor"/>
          <circle cx="8.5" cy="6.5" r="0.5" fill="currentColor"/>
        </svg>
      </button>
      <button id="touchBtn" class="icon-btn" aria-pressed="true"
              data-i18n-title="btnTouch"
              title="Touch: the site receives touch events instead of mouse; drag scrolls; pointer becomes a finger (phones and tablets only)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"/>
          <path d="M12 11V9.5a1.5 1.5 0 0 1 3 0V11"/>
          <path d="M15 11.5v-1a1.5 1.5 0 0 1 3 0V16a5 5 0 0 1-5 5h-1.5a5 5 0 0 1-4.2-2.3L5 14.5a1.5 1.5 0 0 1 2.4-1.8L9 14.5V11"/>
        </svg>
      </button>
    </div>

    <div class="tb-group grow">
      <button id="backBtn" class="icon-btn" data-i18n-title="btnBack" title="Back" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <button id="reloadBtn" class="icon-btn" data-i18n-title="btnReload" title="Reload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>
        </svg>
      </button>
      <input id="addressInput" type="text" spellcheck="false" autocomplete="off"
             data-i18n-aria="addressAria" data-i18n-placeholder="addressPlaceholder"
             aria-label="Site address (URL)"
             placeholder="Enter a URL and press Enter">
      <button id="goBtn" class="text-btn" data-i18n="btnGo" data-i18n-title="btnGoTitle" title="Navigate to URL">Go</button>
    </div>

    <div class="tb-group">
      <button id="zoomOutBtn" class="icon-btn" data-i18n-title="btnZoomOut" title="Zoom out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M5 12h14"/>
        </svg>
      </button>
      <button id="zoomFitBtn" class="text-btn" data-i18n="btnZoomFitLabel" data-i18n-title="btnZoomFit" title="Fit to window">Fit</button>
      <span id="zoomLabel" data-i18n-title="zoomLabel" title="Current zoom">100%</span>
      <button id="zoomInBtn" class="icon-btn" data-i18n-title="btnZoomIn" title="Zoom in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <span class="tb-sep"></span>
      <button id="themeBtn" class="icon-btn" data-i18n-title="btnTheme" title="Toggle light/dark theme">
        <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
        </svg>
        <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="hidden">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <button id="fpsBtn" class="text-btn" aria-pressed="false"
              data-i18n-title="btnFps"
              title="FPS meter: measure frames per second of the embedded site.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h4l2 6 4-14 2 8h6"/>
        </svg>
        FPS
      </button>
      <button id="shotBtn" class="text-btn primary" data-i18n-title="btnCaptureTitle" title="Capture mockup image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <span data-i18n="btnCapture">Capture</span>
      </button>
      <button id="reportBtn" class="text-btn" data-i18n="btnReport" data-i18n-title="btnReportTitle"
              title="Copy report (viewport, UA, FPS) for PR/Jira">Report</button>
      <span class="tb-sep"></span>
      <button id="exitBtn" class="text-btn danger" data-i18n-title="btnExitTitle" title="Exit preview and return to the normal site">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <path d="M16 17l5-5-5-5"/>
          <path d="M21 12H9"/>
        </svg>
        <span data-i18n="btnExit">Exit</span>
      </button>
    </div>
  </header>

  <main id="stage">
    <div id="zoomBox">
      <div id="mockup" data-cutout="punch" data-kind="phone" data-platform="android"
           data-brand="android" data-buttons="right" data-orientation="portrait">
        <div class="device-frame" id="frame">
          <span class="hw-btn btn-power"></span>
          <span class="hw-btn btn-volup"></span>
          <span class="hw-btn btn-voldown"></span>
          <span class="hw-btn btn-mute"></span>
          <span class="earpiece"></span>
          <span class="front-cam"></span>

          <div class="screen">
            <div class="status-bar" id="statusBar">
              <span class="sb-left"><span id="sbTime">9:41</span></span>
              <span class="sb-right">
                <span class="sb-set sb-ios">
                  <svg class="sb-ic" width="18" height="11" viewBox="0 0 18 11" fill="currentColor">
                    <rect x="0" y="7.5" width="3" height="3.5" rx="0.8"/>
                    <rect x="4.7" y="5.5" width="3" height="5.5" rx="0.8"/>
                    <rect x="9.4" y="3" width="3" height="8" rx="0.8"/>
                    <rect x="14.1" y="0.5" width="3" height="10.5" rx="0.8"/>
                  </svg>
                  <span class="sb-net">5G</span>
                  <svg class="sb-ic" width="15" height="11" viewBox="0 0 15 11" fill="currentColor">
                    <path d="M1.2 4.3a9 9 0 0 1 12.6 0L12.5 5.7a7.1 7.1 0 0 0-10 0Z"/>
                    <path d="M3.9 7a5.2 5.2 0 0 1 7.2 0L9.7 8.4a3.2 3.2 0 0 0-4.4 0Z"/>
                    <circle cx="7.5" cy="9.6" r="1.4"/>
                  </svg>
                  <svg class="sb-ic" width="25" height="12" viewBox="0 0 25 12">
                    <rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.4"/>
                    <rect id="battFillIos" x="2" y="2" width="18" height="8" rx="1.8" fill="currentColor"/>
                    <path d="M23 4v4a2.2 2.2 0 0 0 0-4Z" fill="currentColor" fill-opacity="0.4"/>
                  </svg>
                </span>
                <span class="sb-set sb-and">
                  <svg class="sb-ic" width="15" height="11" viewBox="0 0 15 11" fill="currentColor">
                    <path d="M1.2 4.3a9 9 0 0 1 12.6 0L12.5 5.7a7.1 7.1 0 0 0-10 0Z"/>
                    <path d="M3.9 7a5.2 5.2 0 0 1 7.2 0L9.7 8.4a3.2 3.2 0 0 0-4.4 0Z"/>
                    <circle cx="7.5" cy="9.6" r="1.4"/>
                  </svg>
                  <svg class="sb-ic" width="13" height="11" viewBox="0 0 13 11" fill="currentColor">
                    <path d="M13 0v11H0Z"/>
                  </svg>
                  <svg class="sb-ic" width="22" height="11" viewBox="0 0 22 11">
                    <rect x="0.5" y="0.5" width="19" height="10" rx="2" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
                    <rect id="battFillAnd" x="2" y="2" width="16" height="7" rx="1" fill="currentColor"/>
                    <rect x="20.5" y="3.5" width="1.5" height="4" rx="0.7" fill="currentColor" fill-opacity="0.5"/>
                  </svg>
                  <span id="battPct" class="sb-pct">100%</span>
                </span>
              </span>
            </div>

            <span class="cutout" id="cutout">
              <span class="speaker"></span>
              <span class="cam"></span>
            </span>

            <div class="browser-bar bb-top" id="bbTop">
              <span class="bb-pill">
                <svg class="bb-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="4" y="11" width="16" height="10" rx="2"/>
                  <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>
                <span class="bb-host" id="bbHostTop">—</span>
                <svg class="bb-reload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                  <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>
                </svg>
              </span>
              <span class="bb-tabs">1</span>
              <span class="bb-menu"><i></i><i></i><i></i></span>
            </div>

            <div class="browser-bar bb-desktop" id="bbDesktop">
              <div class="bd-tabs">
                <span class="bd-traffic"><i></i><i></i><i></i></span>
                <span class="bd-tab">
                  <span class="bd-favicon"></span>
                  <span class="bd-tab-title" id="bdTab">Nova aba</span>
                  <span class="bd-close">×</span>
                </span>
                <span class="bd-plus">+</span>
                <span class="bd-winbtns"><i class="wb-min"></i><i class="wb-max"></i><i class="wb-close"></i></span>
              </div>
              <div class="bd-omni">
                <span class="bd-arrows">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                  <svg class="bd-dim" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
                </span>
                <span class="bd-url">
                  <svg class="bb-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="11" width="16" height="10" rx="2"/>
                    <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                  </svg>
                  <span class="bd-host" id="bdHost">—</span>
                </span>
                <span class="bd-actions">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9Z"/></svg>
                  <span class="bd-dots"><i></i><i></i><i></i></span>
                </span>
              </div>
            </div>

            <iframe id="viewport" src="about:blank"
                    allow="autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write; local-network-access *"></iframe>

            <div id="fpsMeter" class="hidden" aria-label="Desempenho do site embutido — FPS ao vivo, 1% low (pior caso) e tempo médio de quadro">
              <span id="fpsValue">··· FPS</span>
              <span id="fpsDetail"></span>
            </div>

            <div class="browser-bar bb-bottom" id="bbBottom">
              <span class="bb-pill">
                <span class="bb-aa">AA</span>
                <span class="bb-host" id="bbHostBot">—</span>
                <svg class="bb-reload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                  <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>
                </svg>
              </span>
              <span class="bb-nav">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                <svg class="bb-dim" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5Z"/></svg>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="13" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/></svg>
              </span>
            </div>

            <div id="vkb" aria-hidden="true" data-mode="text">
              <div class="vkb-bar">
                <button type="button" data-key="__hide__" title="Ocultar teclado">⌄</button>
              </div>
              <div id="vkbKeys"></div>
            </div>

            <span class="screen-glare"></span>
            <span class="home-indicator"></span>
          </div>

          <span class="lid-logo"></span>

          <div class="tv-chin">
            <span class="tv-logo">Smart TV</span>
            <span class="tv-led"></span>
          </div>

          <span class="home-btn"><span class="home-square"></span></span>
        </div>

        <div class="tv-stand">
          <span class="tv-neck"></span>
          <span class="tv-base"></span>
        </div>

        <div class="laptop-deck">
          <span class="deck-hinge"></span>
          <span class="deck-body"></span>
          <span class="deck-lip"></span>
        </div>

        <span class="ground"></span>
      </div>
    </div>
  </main>

  <footer id="infoBar">
    <span id="infoName">—</span>
    <span class="sep">·</span>
    <span id="infoViewport">—</span>
    <span class="sep">·</span>
    <span id="infoDpr">—</span>
    <span class="sep">·</span>
    <span id="infoPhysical">—</span>
    <span class="sep">·</span>
    <span id="infoUa" title="">UA: —</span>
  </footer>

  <div id="toast" class="hidden"></div>

  <div id="reviewPrompt" class="review-prompt hidden" role="dialog" aria-live="polite">
    <p data-i18n="reviewBody">Did the capture help? A Chrome Web Store review boosts discovery for other developers.</p>
    <div class="review-actions">
      <button type="button" class="text-btn" id="reviewLater" data-i18n="reviewLater">Not now</button>
      <button type="button" class="text-btn" id="reviewNever" data-i18n="reviewNever">Don’t ask again</button>
      <button type="button" class="text-btn primary" id="reviewGo" data-i18n="reviewGo">Rate ★★★★★</button>
    </div>
  </div>

  <script src="../shared/url.js"></script>
  <script src="../shared/frames.js"></script>
  <script src="../shared/growth.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="preview.js"></script>
</body>
</html>
